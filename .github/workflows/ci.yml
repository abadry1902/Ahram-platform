name: Build and Typecheck
on:
  push:
    branches: [main, design/al-ahram-v4-review, feature/task-analytics-audit-20261026]
  pull_request:
    branches: [main, design/al-ahram-v4-review, feature/task-analytics-audit-20261026]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run test:ui
      - run: npm run test:qa-harness
      - run: npm run test:db-security
      - run: npm run test:analytics
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
